[project]
name = "academic-chief-of-staff"
version = "0.1.0"
description = "智慧學業幕僚多代理系統 — Autonomous Academic Chief of Staff"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "google-genai>=1.0.0",
    "chromadb>=0.5.0",
    "msal>=1.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "typer[all]>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
]

[project.scripts]
chief = "chief_of_staff:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
